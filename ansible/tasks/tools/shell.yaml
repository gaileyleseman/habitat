- name: Install chezmoi
  shell: sh -c "$(curl -fsLS get.chezmoi.io/lb)"
  args:
    creates: ~/.local/bin/chezmoi
  become: false

- name: Initialize chezmoi
  shell: chezmoi init gaileyleseman
  args:
    creates: ~/.local/share/chezmoi/.git
  become: false

