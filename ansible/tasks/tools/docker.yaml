---
- name: Install Docker using convenience script
  shell: curl -fsSL https://get.docker.com | sh
  args:
    creates: /usr/bin/docker
  become: true

- name: Add user to docker group
  user:
    name: "{{ ansible_env.USER }}"
    groups: docker
    append: yes

- name: Start Docker service
  systemd:
    name: docker
    state: started
    enabled: yes