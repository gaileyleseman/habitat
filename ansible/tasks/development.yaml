---
- name: Install Git Tools
  include_tasks: "tools/git.yaml"

- name: Install Shell Tools
  include_tasks: "tools/shell.yaml"

- name: Install Language Support
  include_tasks: "languages/{{ item }}.yaml"
  loop: "{{ language_support }}"
  when: 
    - language_support is defined
    - language_support | length > 0

- name: Install IDEs
  include_tasks: "apps/{{ item }}.yaml"
  loop: "{{ ides }}"
  when: 
    - ides is defined
    - ides | length > 0

- name: Install Containerization Tools
  include_tasks: "tools/{{ item }}.yaml"
  loop: "{{ containerization }}"
  when:
    - containerization is defined
    - containerization | length > 0

- name: Install Cloud Tools
  include_tasks: "tools/{{ item }}.yaml"
  loop: "{{ cloud }}"
  when:
    - cloud is defined
    - cloud | length > 0

- name: Install Development Tools
  include_tasks: "tools/{{ item }}.yaml"
  loop: "{{ tools }}"
  when:
    - tools is defined
    - tools | length > 0
