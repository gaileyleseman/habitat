---
- name: Check if Obsidian is already installed
  stat:
    path: /usr/bin/obsidian
  register: obsidian_exists

- name: Get Obsidian Releases
  ansible.builtin.uri:
    url: https://api.github.com/repos/obsidianmd/obsidian-releases/releases/latest
    return_content: true
  register: json_response
  when: not obsidian_exists.stat.exists

- name: Install Obsidian
  ansible.builtin.apt:
    deb: "{{ item.browser_download_url }}"
  loop_control:
    label: "{{ item.browser_download_url }}"
  loop: "{{ json_response.json.assets }}"
  when: 
    - not obsidian_exists.stat.exists
    - item.browser_download_url is search("amd64.deb")
  register: download_url