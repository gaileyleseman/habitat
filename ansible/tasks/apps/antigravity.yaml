---
- name: Create keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Add Google Antigravity signing key
  shell: |
    curl -fsSL https://us-central1-apt.pkg.dev/doc/repo-signing-key.gpg | \
    gpg --dearmor -o /etc/apt/keyrings/antigravity-repo-key.gpg
  args:
    creates: /etc/apt/keyrings/antigravity-repo-key.gpg

- name: Add Antigravity repository
  copy:
    content: "deb [signed-by=/etc/apt/keyrings/antigravity-repo-key.gpg] https://us-central1-apt.pkg.dev/projects/antigravity-auto-updater-dev/ antigravity-debian main"
    dest: /etc/apt/sources.list.d/antigravity.list
    mode: '0644'

- name: Install Antigravity
  apt:
    name: antigravity
    state: present
    update_cache: yes