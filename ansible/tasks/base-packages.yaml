---
- name: Install Base Packages
  apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: yes
  become: yes
  when: 
    - base_packages is defined
    - base_packages | length > 0

- name: Install Extra Apt Packages
  apt:
    name: "{{ extra_apt_packages }}"
    state: present
    update_cache: yes
  become: yes
  when: 
    - extra_apt_packages is defined
    - extra_apt_packages | length > 0

- name: Install UV
  include_tasks: tools/uv.yaml