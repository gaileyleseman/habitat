---
- name: Complete laptop setup
  hosts: laptops
  become: yes
  
  pre_tasks:
    - name: Show configuration for this machine
      debug:
        msg: |
          Machine: {{ inventory_hostname }}
          Group: {{ group_names }}
          Productivity: {{ productivity | default([]) }}
          Entertainment: {{ entertainment | default([]) }}
          Creative: {{ creative | default([]) }}
          Communication: {{ communication | default([]) }}
          IDEs: {{ ides | default([]) }}
          Containerization: {{ containerization | default([]) }}
          Cloud: {{ cloud | default([]) }}
      tags: always

  tasks:
    - name: Install Packages
      include_tasks: ../tasks/base-packages.yaml
    - name: Install Developer Tools
      include_tasks: ../tasks/development.yaml
    - name: Install Apps
      include_tasks: ../tasks/apps.yaml

