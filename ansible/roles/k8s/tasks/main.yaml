---
- name: Install kubectl
  ansible.builtin.shell: |
    set -o pipefail
    ver="$(curl -L -s https://dl.k8s.io/release/stable.txt)"
    curl -Lo /tmp/kubectl "https://dl.k8s.io/release/${ver}/bin/linux/{{ k8s_arch }}/kubectl"
    install -o root -g root -m 0755 /tmp/kubectl /usr/local/bin/kubectl
    rm -f /tmp/kubectl
  args:
    creates: /usr/local/bin/kubectl
    executable: /bin/bash

- name: Install k3s
  ansible.builtin.shell: |
    set -o pipefail
    curl -sfL https://get.k3s.io | INSTALL_K3S_SKIP_ENABLE=true INSTALL_K3S_SKIP_START=true sh -
  args:
    creates: /usr/local/bin/k3s
    executable: /bin/bash

- name: Install Helm
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  args:
    creates: /usr/local/bin/helm
    executable: /bin/bash
