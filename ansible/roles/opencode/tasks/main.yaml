---
# opencode is distributed via npm, so the javascript role (fnm + Node LTS)
# is declared as a dependency in meta/main.yaml.
- name: Check whether opencode is installed
  ansible.builtin.shell: |
    eval "$("$HOME/.local/share/fnm/fnm" env)"
    fnm use --lts >/dev/null
    command -v opencode
  args:
    executable: /bin/bash
  register: opencode_bin
  changed_when: false
  failed_when: false
  become: false

- name: Install opencode via npm
  ansible.builtin.shell: |
    eval "$("$HOME/.local/share/fnm/fnm" env)"
    fnm use --lts
    npm install -g opencode-ai
  args:
    executable: /bin/bash
  changed_when: true
  when: opencode_bin.rc != 0
  become: false
